name: Build-32bit-OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring xorriso isolinux syslinux-common dosfstools

      - name: Fix line endings and permissions
        run: |
          find config -type f -exec sed -i 's/\r$//' {} +
          chmod +x config/hooks/live/* || true
          chmod +x config/includes.chroot/usr/local/bin/* || true

      - name: Configure and Build 32-bit ISO
        run: |
          sudo lb clean --purge || true
          sudo lb config \
            --mode debian \
            --distribution bookworm \
            --architectures i386 \
            --linux-flavours 686-pae \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --security false \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootappend-live "boot=live components quiet splash" \
            --debian-installer false
          mkdir -p config/archives
          echo "deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware" > config/archives/security.list.chroot
          echo "deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware" > config/archives/security.list.binary
          sudo lb build

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLinux32-ISO
          path: "*.iso"
