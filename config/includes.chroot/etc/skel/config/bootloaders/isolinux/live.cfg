label live-686
.githubmenu label Start MyLinux 32-bit OS
.githubmenu default
.githublinux /live/vmlinuz-686
.githubinitrd /live/initrd.img-686
.githubappend boot=live components quiet splash

label live-686-failsafe
.githubmenu label Start MyLinux 32-bit OS (Safe Video Mode)
.githublinux /live/vmlinuz-686
.githubinitrd /live/initrd.img-686
.githubappend boot=live components memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=788
